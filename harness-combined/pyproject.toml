[project]
name = "harness-combined"
version = "0.0.0"
# Floor is 3.10: the inline-PR-comment orchestrator (gates/pr_commenter.py, ticket
# 0031) dispatches typed result types with a `match` statement.
requires-python = ">=3.10"

[tool.mypy]
# Multiple `skills/*/compute.py` files share a basename with no `__init__.py`
# chain; explicit_package_bases lets mypy qualify each by its directory path
# instead of raising "Duplicate module named" (pre-existing, unrelated to any
# ticket — this repo predates mypy needing this since ticket 0035 added the
# second same-named file).
explicit_package_bases = true
# `tests/` is on the path because test modules import sibling helpers that are
# deliberately not `test_*` (e.g. `_watch_fixtures`), which pytest resolves via
# rootdir insertion but mypy otherwise cannot see at all. Without this, every
# such import reads as `import-not-found`.
# `hooks/` is on the path for the identical reason: each hook does
# `from _common import ...` after putting its own directory on `sys.path`, which
# mypy cannot follow either.
mypy_path = ".:tests:hooks"

# `sarif` is the third-party `sarif-tools` package that tests/test_sarif.py
# imports to cross-verify our emitted SARIF against the real ecosystem loader.
# No stub package exists for it and it is not ours to write one for, so this is
# the one place a suppression is the permanent fix rather than a workaround —
# scoped to this single module, never a blanket `ignore_missing_imports`.
[[tool.mypy.overrides]]
module = ["sarif"]
ignore_missing_imports = true

[tool.bandit]
# B102 (exec_used): server.py uses exec() to load harness-authored spec/task files
# from .harness/specs/ and .harness/tasks/ — never external user input.
skips = ["B102"]
